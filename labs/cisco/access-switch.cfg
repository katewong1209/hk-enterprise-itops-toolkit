! Lab: floor access switch for a 3-VLAN office (Cisco IOS, tested in Packet Tracer / CML style)
! VLAN plan: 10 = Staff, 20 = Voice, 99 = Management, 999 = Blackhole (unused ports)
!
hostname SW-ACC-F12-01
!
service password-encryption
enable secret 9 $9$LAB$notARealHash
no ip domain-lookup
ip domain-name lab.local
!
username netadmin privilege 15 secret 9 $9$LAB$notARealHash
!
ip ssh version 2
!
banner login ^
Authorised use only. Activity is monitored and logged.
^
!
logging host 10.99.0.20
ntp server 10.99.0.10
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
spanning-tree extend system-id
!
vlan 10
 name STAFF
vlan 20
 name VOICE
vlan 99
 name MGMT
vlan 999
 name BLACKHOLE
!
interface Vlan99
 description Management SVI
 ip address 10.99.12.11 255.255.255.0
 no shutdown
!
ip default-gateway 10.99.12.1
!
interface range GigabitEthernet0/1 - 20
 description Staff access
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 switchport port-security
 switchport port-security maximum 3
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range GigabitEthernet0/21 - 22
 description Unused - parked in blackhole VLAN
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface GigabitEthernet0/23
 description UPLINK to CORE-SW-01 Te1/0/12
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
 switchport nonegotiate
 no shutdown
!
interface GigabitEthernet0/24
 description UPLINK to CORE-SW-02 Te1/0/12 (standby)
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
 switchport nonegotiate
 no shutdown
!
line vty 0 15
 login local
 transport input ssh
 exec-timeout 10 0
!
end
