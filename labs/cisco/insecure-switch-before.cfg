! "BEFORE" config - deliberately flawed, used to demonstrate scripts/network/switch_audit.py
! Run:  python scripts/network/switch_audit.py labs/cisco/insecure-switch-before.cfg
hostname SW-OLD
enable password cisco123
!
snmp-server community public RO
snmp-server community private RW
!
interface GigabitEthernet0/1
 switchport mode access
 switchport access vlan 1
!
interface GigabitEthernet0/2
 switchport mode access
 switchport access vlan 1
!
interface GigabitEthernet0/3
 no shutdown
!
line vty 0 4
 password cisco
 login
 transport input all
!
end
