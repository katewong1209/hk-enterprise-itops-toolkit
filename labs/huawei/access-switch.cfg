#
# Lab: floor access switch (Huawei VRP, tested in eNSP style). Mirrors labs/cisco/access-switch.cfg
#
sysname SW-ACC-F12-02
#
info-center loghost 10.99.0.20
ntp-service unicast-server 10.99.0.10
#
header login information "Authorised use only. Activity is monitored and logged."
#
stp mode rstp
stp bpdu-protection
stp edged-port default
#
vlan batch 10 20 99 999
#
interface Vlanif99
 description Management
 ip address 10.99.12.12 255.255.255.0
#
ip route-static 0.0.0.0 0.0.0.0 10.99.12.1
#
interface GigabitEthernet0/0/1
 description Staff access
 port link-type access
 port default vlan 10
 port-security enable
 port-security max-mac-num 3
 port-security protect-action restrict
 stp edged-port enable
#
interface GigabitEthernet0/0/23
 description UPLINK to CORE-SW-01
 port link-type trunk
 port trunk allow-pass vlan 10 20 99
#
interface GigabitEthernet0/0/24
 description Unused
 shutdown
#
aaa
 local-user netadmin password irreversible-cipher $1c$LAB$notARealHash
 local-user netadmin privilege level 15
 local-user netadmin service-type ssh
#
stelnet server enable
undo ssh server compatible-ssh1x enable
ssh user netadmin authentication-type password
#
snmp-agent
snmp-agent sys-info version v3
#
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
 idle-timeout 10 0
#
return
